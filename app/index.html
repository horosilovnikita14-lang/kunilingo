        <button class="hotspot cassette" data-action="music" aria-label="Включить магнитофон" aria-pressed="false"></button>
      </div>

  </div>
  <aside class="paper-menu" aria-label="Главное меню">
    <button id="paperMenuToggle" class="paper-menu-toggle" type="button" aria-label="Свернуть или развернуть меню" aria-expanded="true" aria-controls="paperMenuLinks"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M6 15a6 6 0 0 1 12 0M12 3v2M3 7l2 2M21 7l-2 2"/></svg><span>KuniLingo</span><svg class="menu-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
    <nav id="paperMenuLinks" class="paper-menu-links" aria-label="Разделы приложения">
      <button class="paper-menu-item" type="button" data-section="path" aria-controls="studyPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8a4 4 0 0 1 0 8H8a4 4 0 0 0 0 8h3"/></svg><span>Путь</span></button>
      <button class="paper-menu-item" type="button" data-section="practice" aria-controls="studyPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L20 8l-4-4ZM13 7l4 4M12 21h9"/></svg><span>Практика</span></button>
      <button class="paper-menu-item" type="button" data-section="progress" aria-controls="studyPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V4M19 20V8"/></svg><span>Прогресс</span></button>
    </nav>
  </aside>
  <section id="studyPanel" class="study-panel" aria-labelledby="studyTitle" hidden>
    <header class="study-panel-header">
      <span id="studySubject" class="study-subject">Русский язык · ЕГЭ</span>
      <label id="studySubjectPicker" class="study-subject-picker" hidden><span class="sr-only">Предмет</span><select id="studySubjectSelect" aria-label="Предмет"></select></label>
      <button id="studyClose" class="study-close" type="button" aria-label="Закрыть раздел"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <h1 id="studyTitle" tabindex="-1">Путь</h1>
    <div id="studyBody" class="study-body"><div class="study-empty"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="12" y="9" width="25" height="31" rx="4"/><path d="M12 15H9a3 3 0 0 0-3 3v20a6 6 0 0 0 6 6h18M19 19h11M19 25h11M19 31h6"/></svg><p>Содержание добавим позже.</p></div></div>
  </section>
  <div id="status" class="status" role="status" aria-live="polite">Устраивайся поудобнее</div>
  <footer class="bottom">
    <section id="timelinePanel" class="timeline-panel" aria-label="Перемотка сцены">
      <div class="timeline-label"><label for="writingTimeline">Момент сцены</label><output id="writingPosition" for="writingTimeline">0:00</output></div>
      <input id="writingTimeline" type="range" min="0" max="1" value="0" step="0.01" aria-label="Перемотка сцены">
      <div class="timeline-chapters"><button id="seekFirst">Первая страница</button><button id="seekSlide">Сдвиг тетради</button><button id="seekSecond">Вторая страница</button></div>
    </section>
    <nav class="dock" aria-label="Настройки атмосферы">
      <button id="writingReplay" aria-label="Повторить письмо" title="Повторить письмо с начала"><svg viewBox="0 0 24 24"><path d="m4 17-1 4 4-1L20 7l-3-3Z M14 7l3 3 M12 21h9"/></svg><span>Письмо заново</span></button>
      <i></i>
      <button id="motionToggle" aria-label="Приостановить движение" aria-pressed="true" title="Приостановить движение"><svg viewBox="0 0 24 24"><path class="pause-icon" d="M8 5v14M16 5v14"/><path class="play-icon" d="m9 5 10 7-10 7Z"/></svg><span>Движение</span></button>
      <button id="parallaxToggle" aria-label="Покачивание фона за курсором" aria-pressed="true" title="Покачивание фона за курсором"><svg viewBox="0 0 24 24"><path d="m7 3 12 9-6 1-3 6Z M3 9v7M17 18h4"/></svg><span>Покачивание</span></button>
      <i></i>
      <button id="timelineToggle" aria-label="Показать или скрыть перемотку" aria-expanded="true" aria-controls="timelinePanel"><svg viewBox="0 0 24 24"><path d="M4 5v14M20 5v14M8 8l8 4-8 4Z"/></svg><span>Перемотка</span></button>
      <i></i>
      <button id="soundToggle" aria-label="Включить музыку" aria-pressed="false" title="Включить музыку"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg><span>Музыка</span></button>
      <div class="volume-control">
        <label for="volumeControl" class="sr-only">Громкость музыки</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z M15 8a6 6 0 0 1 0 8 M18 5a10 10 0 0 1 0 14"/></svg>
        <input id="volumeControl" type="range" min="0" max="100" step="1" value="35" aria-valuetext="35%">
        <output id="volumeValue" for="volumeControl" aria-hidden="true">35%</output>
      </div>
      <i></i>
      <button id="fullscreenToggle" aria-label="На весь экран" aria-pressed="false" title="На весь экран"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><span class="sr-only">На весь экран</span></button>
    </nav>
  </footer>
</main>
<script type="module" src="room.js"></script>
<script type="module" src="paper-menu.js"></script>
<script type="module">
  import {attachRoomCamera} from './room-camera.js';
  const detachCamera=attachRoomCamera(document.querySelector('#room'),document.querySelector('#stage'),document.querySelector('.scene-wrap'));
  if (['56', '57', '59'].includes(new URLSearchParams(location.search).get('ui'))) {
    await import('./ui-study56.js');
  }
  window.addEventListener('pagehide',event=>{if(!event.persisted)detachCamera();});
</script>
